<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PR Code Stats</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
      label { display: block; font-weight: 600; margin: 16px 0 4px; }
      textarea, input { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; padding: 6px; }
      textarea { height: 180px; }
      p.hint { color: #666; margin: 4px 0; font-size: 12px; }
      button { margin-top: 16px; padding: 6px 14px; }
      #saved { margin-left: 8px; color: #1a7f37; }
    </style>
  </head>
  <body>
    <h2>PR Code Stats</h2>

    <label for="patterns">Test file patterns</label>
    <p class="hint">One regex per line, matched against the file path. Lines starting with # are ignored.</p>
    <textarea id="patterns" spellcheck="false"></textarea>

    <label for="token">GitHub token (optional)</label>
    <p class="hint">Not needed when you are logged in to github.com. Only set it if counts fail to load.</p>
    <input id="token" type="password" autocomplete="off" />

    <button id="save">Save</button>
    <button id="reset">Reset patterns</button>
    <span id="saved"></span>

    <script src="patterns.js"></script>
    <script src="options.js"></script>
  </body>
</html>
